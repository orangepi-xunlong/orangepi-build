source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

OVERLAY_PREFIX='rk3588'
BOOTDELAY=0

CPUMIN=408000
CPUMAX=2400000

case $BRANCH in

	legacy)

		BOOTBRANCH='branch:v2017.09-rk3588'
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 8.0'

		KERNELBRANCH='branch:orange-pi-5.10-rk35xx'
		KERNELPATCHDIR='rockchip-rk3588-legacy'
		LINUXCONFIG="linux-rockchip-rk3588-legacy"
		[[ ${BOARD} == orangepi5pro ]] && LINUXCONFIG="linux-rockchip-rk3588-legacy-opi5pro"
		[[ ${BOARD} =~ orangepi5max|orangepi5ultra ]] && LINUXCONFIG="linux-rockchip-rk3588-legacy-opi5max"
		[[ ${BOARD} == orangepicm5-tablet ]] && LINUXCONFIG="linux-rockchip-rk3588-legacy-opicm5-tablet"

		if [[ "${build_rt_image}" =~ yes ]]; then
			KERNELBRANCH='branch:orange-pi-5.10-rk35xx-rt'
			LINUXCONFIG="linux-rockchip-rk3588-legacy-rt"
			[[ ${BOARD}x =~ orangepi5prox|orangepi5maxx|orangepi5ultrax ]] && LINUXCONFIG="linux-rockchip-rk3588-legacy-rt-opi5pro"
		fi

		KERNEL_USE_GCC='> 10.0'

		;;
	current)

		BOOTBRANCH='branch:v2017.09-rk3588'
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 8.0'

		KERNELBRANCH='branch:orange-pi-6.1-rk35xx'
		KERNELPATCHDIR='rockchip-rk3588-current'
		LINUXCONFIG="linux-rockchip-rk3588-current"
		[[ ${BOARD} == orangepicm5-tablet ]] && LINUXCONFIG="linux-rockchip-rk3588-current-opicm5-tablet"
		[[ ${BOARD} =~ orangepi5pro|orangepi5max|orangepi5ultra ]] && LINUXCONFIG="linux-rockchip-rk3588-current-opi5pro"

		KERNEL_USE_GCC='> 10.0'
		;;
	next)
		BOOTBRANCH='branch:v2017.09-rk3588'
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 8.0'

		KERNELBRANCH='branch:orange-pi-6.18-rk35xx'
		LINUXCONFIG="linux-rockchip-rk3588-next"
		OVERLAY_PREFIX='rockchip-rk3588'
		;;
esac

prepare_boot_configuration

family_tweaks_bsp() {

	install -m 755 $EXTER/packages/bsp/adb/adbd-${ARCH} ${destination}/usr/bin/adbd

	# HDMI-in preview helper.  Only next runs the mainline hdmirx driver this
	# is written against; legacy and current are left alone.  The heredoc is
	# quoted and unindented on purpose - it is written out verbatim, so tabs
	# here would end up in the installed script.
	if [[ $BRANCH == next ]]; then
		cat > "${destination}"/usr/bin/test_hdmiin.sh << 'EOF'
#!/bin/bash
#

export GST_GL_WINDOW=x11
export GST_GL_PLATFORM=egl
export XDG_RUNTIME_DIR=/run/user/1000

if [[ -z ${DISPLAY:-} || ! -r ${XAUTHORITY:-} ]]; then
	: "${DISPLAY:=:0}"
	XAUTHORITY=$(ls /run/user/"$(id -u)"/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
	export DISPLAY XAUTHORITY
fi

DEV=$(v4l2-ctl --list-devices | awk '/hdmirx/{getline; gsub(/[ \t]/,""); print; exit}')

if ! TIMINGS=$(v4l2-ctl -d "$DEV" --query-dv-timings 2>/dev/null); then
	echo "No HDMI input signal, exit."
	exit 0
fi
echo "$TIMINGS"

MODE=$(cat /sys/class/drm/card*-HDMI-A-*/modes 2>/dev/null | head -1)
: "${MODE:=1920x1080}"

source /etc/os-release
case "$ID" in
    ubuntu)
gst-launch-1.0 v4l2src device="$DEV" io-mode=4 \
	! glupload ! glcolorconvert ! glimagesink sync=false \
	render-rectangle="<0,0,${MODE%x*},${MODE#*x}>" \
	pipewiresrc target-object=alsa_input.platform-hdmi-receiver-sound.stereo-fallback \
	! audioconvert ! audioresample ! pipewiresink sync=false async=false
        ;;
    debian)
gst-launch-1.0 \
	v4l2src device="$DEV" io-mode=4 \
	! videoconvert \
	! ximagesink sync=false \
	pulsesrc device=alsa_input.platform-hdmi-receiver-sound.stereo-fallback \
	! audioconvert ! audioresample ! pulsesink sync=false async=false
        ;;
    *)
        exit 1
        ;;
esac

EOF
		chmod 755 "${destination}"/usr/bin/test_hdmiin.sh
	fi

	:
}


install_balenaEtcher(){

	if [[ $BUILD_DESKTOP == yes && $install_balena_etcher == yes ]]; then

		balena_etcher_deb=balena-etcher-electron_1.7.9+5945ab1f_arm64.deb
		balena_etcher_url="https://github.com/Itai-Nelken/BalenaEtcher-arm/releases/download/v1.7.9/${balena_etcher_deb}"
		balena_etcher=${EXTER}/cache/debs/arm64/${balena_etcher_deb}

		if [[ ! -f ${balena_etcher} ]]; then
			wget -P ${EXTER}/cache/debs/arm64 ${balena_etcher_url}
		fi

		install_deb_chroot ${balena_etcher}
	fi
}

family_tweaks_s() {
	# Prebuilt Kodi V4L2 Request libraries and desktop launcher for Trixie next.
	if [[ ${RELEASE} == trixie && ${BRANCH} == next && ${SELECTED_CONFIGURATION} == desktop ]]; then
		local kodi_package
		for kodi_package in \
			orangepi-kodi-ffmpeg_7.1.3+v4l2request20260914-1~test1_arm64.deb \
			orangepi-kodi-config_7.1.3+v4l2request20260914-1~test1_all.deb; do
			install_deb_chroot "${EXTER}/cache/sources/rk35xx_packages/trixie/kodi_ffmpeg/${kodi_package}"
		done
	elif [[ ${RELEASE} == resolute && ${BRANCH} == next && ${SELECTED_CONFIGURATION} == desktop ]]; then
		local kodi_package
		for kodi_package in \
			orangepi-kodi-ffmpeg_8.0.1+v4l2request20260915-1~test1_arm64.deb \
			orangepi-kodi-config_8.0.1+v4l2request20260915-1~test1_all.deb; do
			install_deb_chroot "${EXTER}/cache/sources/rk35xx_packages/resolute/kodi_ffmpeg/${kodi_package}"
		done
	fi

	if [[ ${BRANCH} == next ]]; then
		rsync -a --chown=root:root --exclude=etc/pulse --exclude=etc/mpv --exclude=etc/X11 "${EXTER}"/packages/bsp/rk3588/* ${SDCARD}/
		rm ${SDCARD}/etc/profile.d/x11.sh ${SDCARD}/etc/profile.d/gst.sh ${SDCARD}/etc/profile.d/cogl.sh
	else
		rsync -a --chown=root:root "${EXTER}"/packages/bsp/rk3588/* ${SDCARD}/
	fi

	if [[ ${SELECTED_CONFIGURATION} == desktop && ${DESKTOP_ENVIRONMENT} == kde-plasma ]]; then

		cat > "${SDCARD}"/etc/profile.d/kde_env.sh <<- __EOF__
		#!/bin/bash

		export KWIN_COMPOSE=X
		__EOF__

		cat > "${SDCARD}"/home/orangepi/.config/kwalletrc <<- __EOF__
		[Wallet]
		Enabled=false
		__EOF__

		if [[ ${RELEASE} == bullseye ]]; then
			cat > "${SDCARD}"/home/orangepi/.config/kwinrc <<- __EOF__
			[Compositing]
			Backend=XRender
			OpenGLIsUnsafe=false
			__EOF__

			cat <<-EOF >>"${SDCARD}"/home/orangepi/.config/kglobalshortcutsrc
			[org.kde.konsole.desktop]
			NewTab=,,Open a New Tab
			NewWindow=,,Open a New Window
			_k_friendly_name=Konsole
			_launch=Ctrl+Alt+T,,Konsole
			EOF

			cat <<-EOF >>"${SDCARD}"/home/orangepi/.config/plasma-org.kde.plasma.desktop-appletsrc
			[Containments][2][Applets][5][Configuration][General]
			launchers=applications:systemsettings.desktop,applications:org.kde.discover.desktop,preferred://filemanager,preferred://browser,applications:org.kde.konsole.desktop

			[Containments][2][Applets][5][Configuration][General]
			launchers=applications:systemsettings.desktop,applications:org.kde.discover.desktop,preferred://filemanager,preferred://browser,applications:org.kde.konsole.desktop,applications:chromium-browser.desktop
			EOF
		fi
	fi

	if [[ ${BOARD} =~ orangepi5plus|orangepiaimax|orangepi5max|orangepi900|orangepi5ultra ]]; then

		# same reasoning as the rk3588 tree above
		if [[ $BRANCH != next ]]; then
			rsync -a --chown=root:root "${EXTER}"/packages/bsp/orangepi5plus/* ${SDCARD}/
		fi
		cp $EXTER/cache/sources/linuxpg "${SDCARD}"/opt/ -rfa
	fi

	if [[ ${BOARD} =~ orangepicm5 ]]; then

		cp $EXTER/cache/sources/linuxpg "${SDCARD}"/opt/ -rfa
	fi

	[[ ${RELEASE} == jammy ]] && rm ${SDCARD}/etc/profile.d/orangepi-ssh-title.sh # for adbd

	if [[ -f "${SDCARD}"/etc/profile.d/im-config_wayland.sh && ${DESKTOP_ENVIRONMENT} =~ xfce|kde-plasma ]]; then
		chroot $SDCARD /bin/bash -c "rm /etc/profile.d/im-config_wayland.sh" # for adbd
	fi

	# enable additional services
	chroot "${SDCARD}" /bin/bash -c "systemctl --no-reload enable usbdevice.service >/dev/null 2>&1"
	#[[ $BOARD == orangepi5plus ]] && chroot "${SDCARD}" /bin/bash -c "systemctl --no-reload enable pwm-fan.service >/dev/null 2>&1"

	sed "s/^SIZE=.*/SIZE=200M/" -i "${SDCARD}"/etc/default/orangepi-ramlog
	chroot "${SDCARD}" /bin/bash -c "ln -fs /usr/share/zoneinfo/Asia/Shanghai /etc/localtime"
	chroot "${SDCARD}" /bin/bash -c "dpkg-reconfigure -f noninteractive tzdata" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1

	chroot $SDCARD /bin/bash -c "apt-get -y -qq install usb-modeswitch tree dnsmasq v4l-utils swig python3-dev python3-setuptools bluez libncurses-dev" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1

	[[ ${BOARD} =~ orangepiaimax ]] && install_310b-npu-driver
	install_wiringop
	install_balenaEtcher

	# Board audio specific changes
	if [[ ${RELEASE} == resolute || ${RELEASE} == trixie ]]; then
		install -D -m 644 "${EXTER}/packages/bsp/rockchip/60-hdmi-default-output.conf" \
			"${SDCARD}/etc/wireplumber/wireplumber.conf.d/60-hdmi-default-output.conf" \
			|| exit_with_error "Failed to install HDMI output priority configuration"
	fi

	if [[ ${BOARD}x =~ orangepi5x|orangepi5bx|orangepicm5-tabletx|orangepi5prox ]]; then

		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8388-sound", ENV{SOUND_DESCRIPTION}="ES8388 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules

	elif [[ ${BOARD}x =~ orangepicm5x ]]; then

		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules

	elif [[ "${BOARD}x" =~ orangepi5plusx|orangepiaimaxx|orangepi900x ]]; then

		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi1-sound", ENV{SOUND_DESCRIPTION}="HDMI1 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmiin-sound", ENV{SOUND_DESCRIPTION}="HDMI-In Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8388-sound", ENV{SOUND_DESCRIPTION}="ES8388 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules

	elif [[ "${BOARD}x" == orangepi5maxx ]]; then

		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi1-sound", ENV{SOUND_DESCRIPTION}="HDMI1 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8388-sound", ENV{SOUND_DESCRIPTION}="ES8388 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules

	elif [[ "${BOARD}x" == orangepi5ultrax ]]; then

		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi1-sound", ENV{SOUND_DESCRIPTION}="HDMI Audio"' > ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmiin-sound", ENV{SOUND_DESCRIPTION}="HDMI-In Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
		echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8388-sound", ENV{SOUND_DESCRIPTION}="ES8388 Audio"' >> ${SDCARD}/etc/udev/rules.d/90-naming-audios.rules
	fi

	# Realtek 8811CU/8821CU usb modeswitch support
	if [[ -f ${SDCARD}/lib/udev/rules.d/40-usb_modeswitch.rules ]]; then
		cp ${SDCARD}/lib/udev/rules.d/40-usb_modeswitch.rules ${SDCARD}/etc/udev/rules.d/40-usb_modeswitch.rules
		sed '/LABEL="modeswitch_rules_end"/d' -i ${SDCARD}/etc/udev/rules.d/40-usb_modeswitch.rules
		cat >> ${SDCARD}/etc/udev/rules.d/40-usb_modeswitch.rules <<-EOF
		# Realtek 8821CU Wifi AC USB
		ATTR{idVendor}=="0bda", ATTR{idProduct}=="1a2b", RUN+="/usr/sbin/usb_modeswitch -K -v 0bda -p 1a2b"
		LABEL="modeswitch_rules_end"
		EOF
	fi

	if [[ "${BOARD}x" == orangepi5ultrax ]]; then
		cp $EXTER/cache/sources/orangepi-firmware-git/nvram_ap6611s.txt-${BOARD} ${SDCARD}/lib/firmware/nvram_ap6611s.txt

	elif [[ "${BOARD}x" == orangepicm5-tabletx ]]; then
		cp $EXTER/cache/sources/orangepi-firmware-git/nvram_ap6256.txt-${BOARD} ${SDCARD}/lib/firmware/nvram_ap6256.txt
	fi

	[[ $RELEASE == resolute ]] && sed -i '1a case "$(tty)" in /dev/ttyS*|/dev/ttyAMA*|/dev/ttyUSB*) return 0 ;; esac' ${SDCARD}/lib/systemd/profile.d/80-systemd-osc-context.sh

	# Chromium from the XtraDeb PPA.
	#
	# Ubuntu's chromium is a snap shim -- chromium-browser 2:1snap1-0ubuntu4,
	# which merely Provides: chromium -- and pulls in snapd, which is
	# unreliable on these boards. XtraDeb publishes a real .deb.
	#
	# resolute only: that is the sole release the PPA builds for, and the
	# hardware decode flag below is specific to the Chromium 150+ launcher.
	if [[ ${RELEASE} == resolute && ${DESKTOP_ENVIRONMENT} == gnome ]]; then

		display_alert "Installing chromium from the XtraDeb PPA" "${BOARD} ${RELEASE}" "info"

		chroot "${SDCARD}" /bin/bash -c "
			set -e
			export DEBIAN_FRONTEND=noninteractive

			# add-apt-repository fetches the key, so nothing is hardcoded
			apt-get install -y software-properties-common
			add-apt-repository -y -n ppa:xtradeb/apps
			apt-get update

			# drop the snap shim if the browsers appgroup pulled it in
			if dpkg -l chromium-browser 2>/dev/null | grep -q '^ii'; then
				apt-get -y remove chromium-browser
			fi

			apt-get -y install chromium
		" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1

		# /etc/chromium.d/* is sourced by the chromium launcher. Note the flag
		# is AcceleratedVideoDecoder: AcceleratedVideoDecodeLinuxGL is not the
		# gating flag, AcceleratedVideoDecodeLinuxV4L2 was removed in 150+, and
		# --enable-accelerated-video-decode has been gone for just as long.
		mkdir -p "${SDCARD}"/etc/chromium.d
		echo 'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --enable-features=AcceleratedVideoDecoder"' \
			> "${SDCARD}"/etc/chromium.d/50-hwdecode

		# Keep Chromium out of the Secret Service.
		#
		# These images autologin (desktop.sh uncomments AutomaticLoginEnable in
		# /etc/gdm3/custom.conf), so PAM's auth phase never sees a password and
		# pam_gnome_keyring has nothing to create or unlock the login keyring
		# with -- gdm-autologin has no "@include common-auth", unlike
		# gdm-password. Chromium is the first thing to ask libsecret for its
		# "Chromium Safe Storage" key, and with no default collection
		# gnome-keyring pops up "Choose password for new keyring" on every
		# freshly flashed board.
		#
		# --password-store=basic makes Chromium use its own store instead. Its
		# saved passwords end up obfuscated rather than encrypted, which is the
		# same tradeoff as answering that dialog with an empty password. Other
		# libsecret clients (GNOME Online Accounts, NetworkManager) still
		# prompt; fixing those means creating an empty-password default keyring
		# at first login, which needs gnome-keyring itself and has not been
		# validated here.
		echo 'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --password-store=basic"' \
			> "${SDCARD}"/etc/chromium.d/60-password-store
	elif [[ ${RELEASE} == trixie && ${DESKTOP_ENVIRONMENT} == gnome ]]; then
		display_alert "Installing chromium" "${BOARD} ${RELEASE}" "info"
		chroot "${SDCARD}" /bin/bash -c "apt-get install -y chromium chromium-l10n" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1
		mkdir -p "${SDCARD}"/etc/chromium.d
		echo 'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --enable-features=AcceleratedVideoDecoder"' \
			> "${SDCARD}"/etc/chromium.d/50-hwdecode
		echo 'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --password-store=basic"' \
			> "${SDCARD}"/etc/chromium.d/60-password-store
	fi
}
