BOOTENV_FILE='sophon.txt'
OVERLAY_PREFIX='bm1688'
OFFSET=1
ATFSOURCE=''
ATF_COMPILE="no"

echo ATFSOURCE=$ATFSOURCE

case "${BRANCH}" in

	current)
		BOOTBRANCH='branch:v2021.10-bm1688'

		KERNELBRANCH="branch:orange-pi-5.10-bm1688"
		KERNELPATCHDIR="sophon-bm1688-${BRANCH}"
		UBOOT_TARGET_MAP=";;fip.bin"
		;;

esac


uboot_custom_postprocess()
{
	:
}

write_uboot_platform()
{
	if [[ -b "${2}boot0" ]]; then
		echo 0 > /sys/block/${2##*/}boot0/force_ro
		dd if=${1}/fip.bin of=${2}boot0 >/dev/null 2>&1 && sync
		dd if=${1}/fip.bin of=${2}boot0 seek=2048 >/dev/null 2>&1 && sync
		echo 1 > /sys/block/${2##*/}boot0/force_ro
	else
		cp $1/fip.bin $2/boot/ -rf
	fi

}

