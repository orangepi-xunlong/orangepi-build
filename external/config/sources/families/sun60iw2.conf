source "${BASH_SOURCE%/*}/include/sunxi64_common.inc"

LINUXFAMILY=sun60iw2
ENABLE_OVERLAYROOT=yes  # Enable overlayroot support for this family

[[ -z $CPUMIN ]] && CPUMIN=416000
[[ -z $CPUMAX ]] && CPUMAX=2002000
GOVERNOR=ondemand

OFFSET=32
OVERLAY_PREFIX='sun60i-t736'
BOOTBRANCH='branch:v2018.05-sun60iw2'
UBOOT_COMPILER="arm-linux-gnueabi-"
UBOOT_USE_GCC='> 6.0'
BOOTENV_FILE='sun60iw2.txt'
BOOTSCRIPT='boot-sun60iw2.cmd:boot.cmd'
KERNEL_USE_GCC='> 10.0'
ATFSOURCE=""
ATF_COMPILE="no"
INITRD_ARCH=arm
UBOOT_TARGET_MAP=";;dts/${BOARD}-u-boot.dts boot0_sdcard.fex boot0_spinor_a733.fex boot0_ufs.fex boot_package.fex"
KERNELPATCHDIR=${BOARDFAMILY}-${BRANCH}
MAINLINE_UBOOT_SOURCE='https://gitee.com/orangepi-xunlong/u-boot-orangepi.git'

case $BRANCH in

	legacy)
		if [[ $GITEE_SERVER == yes ]]; then
			KERNELSOURCE="https://gitee.com/orangepi-xunlong/orange-pi-5.15-sun60iw2.git"
		fi

		KERNELBRANCH="branch:orange-pi-5.15-sun60iw2"
		LINUXCONFIG="linux-sun60iw2-legacy"

		if [[ "${BOARD}" =~ "orangepi4pro"|"orangepizero3w"|"orangepizero4" ]]; then
			OVERLAY_PREFIX='sun60i-a733'
			LINUXCONFIG="linux-sun60iw2-legacy-a733"
		fi

	;;

	current)
		if [[ $GITEE_SERVER == yes ]]; then
			KERNELSOURCE="https://gitee.com/orangepi-xunlong/orange-pi-6.6-sun60iw2.git"
		fi

		KERNELBRANCH="branch:orange-pi-6.6-sun60iw2"
		LINUXCONFIG="linux-sun60iw2-current"

		if [[ "${BOARD}" =~ "orangepi4pro"|"orangepizero3w"|"orangepizero4" ]]; then
			OVERLAY_PREFIX='sun60i-a733'
			LINUXCONFIG="linux-sun60iw2-current-a733"
		fi
	;;
esac

family_tweaks_s()
{
	if [[ ${DESKTOP_ENVIRONMENT} == gnome ]]; then
		run_on_sdcard "DEBIAN_FRONTEND=noninteractive apt-get install -y gnome-screenshot tightvncserver gnome-bluetooth"
		cp $EXTER/packages/blobs/desktop/desktop-wallpapers/orangepi-default.png ${SDCARD}/usr/share/backgrounds/warty-final-ubuntu.png
	fi

	if [[ $RELEASE == bookworm && ${DESKTOP_ENVIRONMENT} == gnome ]]; then
		sed -i "s/user-session.*/user-session=gnome-wayland/" ${SDCARD}/etc/lightdm/lightdm.conf.d/22-orangepi-autologin.conf
		run_on_sdcard "systemctl mask sleep.target suspend.target hibernate.target hybrid-sleep.target" > /dev/null 2>&1
	fi

	[[ $RELEASE == jammy && ${DESKTOP_ENVIRONMENT} == xfce ]] && chroot $SDCARD /bin/bash -c "apt-get -y -qq install ocl-icd-libopencl1" >/dev/null 2>&1

	#if [[ "${BOARD}x" == orangepi4ax ]]; then
	#	nvram=$EXTER/cache/sources/orangepi-firmware-git
	#	[[ -f ${nvram}/nvram_ap6256.txt-$BOARD ]] && cp ${nvram}/nvram_ap6256.txt-${BOARD} ${SDCARD}/lib/firmware/nvram_ap6256.txt
	#fi

	rsync -a --chown=root:root "${EXTER}"/packages/bsp/overlays_arm64/* ${SDCARD}/

	chroot $SDCARD /bin/bash -c "apt-get -y -qq install libopencv-dev mtd-utils rfkill bluetooth bluez bluez-tools ir-keytable tree lirc v4l-utils dnsmasq" >/dev/null 2>&1

	if [[ $BUILD_DESKTOP == yes ]]; then

		sed -i "s/auto-profiles = yes/auto-profiles = no/" ${SDCARD}/usr/share/pulseaudio/alsa-mixer/profile-sets/default.conf

		# Auto-detect audio cards at first boot instead of hardcoding card numbers
		cat <<-'AUDIOSETUP' > ${SDCARD}/usr/lib/orangepi/orangepi-audio-setup
		#!/bin/bash
		PA_CONF=/etc/pulse/default.pa
		# Skip if already configured
		grep -q "HDMI-Playback" $PA_CONF 2>/dev/null && exit 0
		# Find HDMI card
		hdmi_card=$(aplay -l 2>/dev/null | grep -i "hdmi" | head -1 | grep -o "card [0-9]*" | awk '{print $2}')
		# Find a non-HDMI playback card (audio codec)
		codec_card=$(aplay -l 2>/dev/null | grep "card [0-9]*" | grep -iv "hdmi" | head -1 | grep -o "card [0-9]*" | awk '{print $2}')
		[[ -n $hdmi_card ]] && echo "load-module module-alsa-sink device=hw:${hdmi_card},0 sink_name=HDMI-Playback sink_properties=\"device.description='HDMI Audio'\"" >> $PA_CONF
		[[ -n $codec_card ]] && echo "load-module module-alsa-sink device=hw:${codec_card},0 sink_name=AudioCodec-Playback sink_properties=\"device.description='Audio Codec'\"" >> $PA_CONF
		[[ -n $hdmi_card || -n $codec_card ]] && pulseaudio -k 2>/dev/null || true
		exit 0
		AUDIOSETUP
		chmod +x ${SDCARD}/usr/lib/orangepi/orangepi-audio-setup
		# Run once at boot via a oneshot service
		cat <<-'AUDIOUNIT' > ${SDCARD}/etc/systemd/system/orangepi-audio-setup.service
		[Unit]
		Description=Orange Pi audio card detection
		After=pulseaudio.service
		[Service]
		Type=oneshot
		ExecStart=/usr/lib/orangepi/orangepi-audio-setup
		RemainAfterExit=yes
		[Install]
		WantedBy=multi-user.target
		AUDIOUNIT
		chroot ${SDCARD} /bin/bash -c "systemctl enable orangepi-audio-setup.service"


		#case $RELEASE in
		#	bullseye|bookworm) chroot $SDCARD /bin/bash -c "apt-get -y -qq install firefox-esr" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1 ;;
		#esac

		chroot $SDCARD /bin/bash -c "apt-get -y -qq install mpv" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1

	fi

	if [[ ${BRANCH} == current ]]; then
		SERIALCON="ttyS0"
	fi

	[[ $RELEASE == resolute ]] && sed -i '1a case "$(tty)" in /dev/ttyS*|/dev/ttyAMA*|/dev/ttyUSB*) return 0 ;; esac' ${SDCARD}/lib/systemd/profile.d/80-systemd-osc-context.sh

	rsync -a --chown=root:root "${EXTER}"/packages/bsp/sun60iw2/* ${SDCARD}/
	rsync -a --chown=root:root $EXTER/cache/sources/sun60iw2_packages/npu/* ${SDCARD}/

	dpkg_install_debs_chroot "${EXTER}/cache/sources/sun60iw2_packages/libAWIspApi"
	dpkg_install_debs_chroot "${EXTER}/cache/sources/sun60iw2_packages/libcedarc"
	dpkg_install_debs_chroot "${EXTER}/cache/sources/sun60iw2_packages/gst-omx-generic1.0"


	if [[ $RELEASE =~ bullseye|resolute|trixie && ${SELECTED_CONFIGURATION} == desktop ]]; then

		run_on_sdcard "apt-get -y -qq install gstreamer1.0-x gstreamer1.0-plugins-bad gstreamer1.0-alsa libxcb-dri2-0 vulkan-tools clinfo opencl-headers ocl-icd-opencl-dev"

		if [[ $RELEASE =~ resolute|trixie ]]; then
			echo 'GSK_RENDERER=cairo' >> ${SDCARD}/etc/environment
		elif [[ $RELEASE =~ bullseye ]]; then
			echo 'QT_XCB_GL_INTEGRATION=none' >> ${SDCARD}/etc/environment
			dpkg_install_debs_chroot "${EXTER}/cache/sources/sun60iw2_packages/glmark2"
			dpkg_install_debs_chroot "${EXTER}/cache/sources/sun60iw2_packages/gstreamer1.0-plugins-good"
		fi

		cp -rf ${EXTER}/cache/sources/sun60iw2_packages/xserver_${RELEASE}/xserver-xorg-img-bxm_1.21.1-2_arm64.deb ${SDCARD}
		run_on_sdcard "dpkg -i --force-overwrite /xserver-xorg-img-bxm_1.21.1-2_arm64.deb" >> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1
		rm -rf ${SDCARD}/xserver-xorg-img-bxm_1.21.1-2_arm64.deb

		dpkg_install_debs_chroot "${EXTER}/cache/sources/sun60iw2_packages/vlc_${RELEASE}"

		OPI_UID=$(chroot $SDCARD id -u $OPI_USERNAME)
		OPI_GID=$(chroot $SDCARD id -g $OPI_USERNAME)
		install -m 755 -o $OPI_UID -g $OPI_GID -d $SDCARD/home/$OPI_USERNAME/.config/vlc
		install -m 600 -o $OPI_UID -g $OPI_GID  ${EXTER}/cache/sources/sun60iw2_packages/vlc_${RELEASE}/vlcrc $SDCARD/home/$OPI_USERNAME/.config/vlc

		sed -i 's/enable_scaledown_while_4k = 1/enable_scaledown_while_4k = 0/' $SDCARD/etc/cedarc.conf

		local version
		version=$(grab_version "$LINUXSOURCEDIR")
		install -m 755 -d $SDCARD/lib/modules/$version-$BOARDFAMILY/extra
		install -m 644 ${SRC}/.tmp/gpu_modules_sun60iw2/pvrsrvkm.ko $SDCARD/lib/modules/$version-$BOARDFAMILY/extra
		depmod -b $SDCARD $version-$BOARDFAMILY

		wget -nc -P ${EXTER}/cache/debs/arm64/ https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb >>"${DEST}"/${LOG_SUBPATH}/install.log 2>&1
		install_deb_chroot "${EXTER}/cache/debs/arm64/google-chrome-stable_current_arm64.deb"
		sed -i "s|exec -a \"\$0\" \"\$HERE/chrome\" \"\$@\"|exec -a \"\$0\" \"\$HERE/chrome\" --use-gl=angle --use-angle=vulkan --enable-features=Vulkan,VulkanFromANGLE --ignore-gpu-blocklist \"\$@\"|" $SDCARD/opt/google/chrome/google-chrome
	fi

	install_wiringop
}

