# Name the HDMI cards and the DP-to-HDMI one, and prefer HDMI playback
# without changing ES8388 capture.  WirePlumber falls back to a generic
# "Built-in Audio" for every internal card, so the Sound panel would
# otherwise list several identically named devices.
# Explicit user selections saved by WirePlumber still take precedence.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "hdmi0" }
    ]
    actions = {
      update-props = {
        device.description = "HDMI0 Audio"
      }
    }
  }
  {
    matches = [
      { api.alsa.card.name = "hdmi1" }
    ]
    actions = {
      update-props = {
        device.description = "HDMI1 Audio"
      }
    }
  }
  {
    matches = [
      { api.alsa.card.name = "rockchip,dp0" }
    ]
    actions = {
      update-props = {
        device.description = "DP0 Audio"
      }
    }
  }
  {
    matches = [
      { api.alsa.card.name = "rockchip,es8388" }
    ]
    actions = {
      update-props = {
        device.description = "ES8388 Audio"
      }
    }
  }
  {
    matches = [
      { api.alsa.card.name = "RK3588 HDMI-IN" }
    ]
    actions = {
      update-props = {
        device.description = "HDMIRX Audio"
      }
    }
  }
  {
    matches = [
      {
        media.class = "Audio/Sink"
        node.name = "~alsa_output.platform-hdmi0-sound.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1400
      }
    }
  }
  {
    matches = [
      {
        media.class = "Audio/Source"
        node.name = "~alsa_input.platform-hdmi-receiver-sound.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1400
      }
    }
  }
]
