set debug=loader,mm
set term=vt100
set default=0
set timeout=2

menuentry '0 Ubuntu (ACPI)' {
    linux /Image \
        console=ttyAMA2,115200 \
        efi=noruntime \
        earlycon=pl011,0x040d0000 \
        arm-smmu-v3.disable_bypass=0 \
        cma=640M \
        acpi=force splash \
        loglevel=4 \
        pcie_aspm=off \
        resume=PARTUUID= noresume root=/dev/ rootwait rw
}
